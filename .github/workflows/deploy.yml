name: Deploy to GitHub Pages

on:
  # 每次推送到 main 分支时部署静态官网（sollinplayer-website/）
  push:
    branches: [main]
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，避免并发覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 纯静态单文件官网目录（index.html + 404.html + assets/）
          path: ./sollinplayer-website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
